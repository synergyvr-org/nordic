baseURL = 'https://synergyvr.org/nordic/'
CanonifyURLs=true
locale = 'en-us'
title = "Nordic Adventures for Skyrim VR"
theme = 'relearn'
# The shared Synergy layer (shortcodes, styles, scripts, layout overrides) is a
# Hugo Module. It must resolve ahead of Relearn so its overrides win, which is
# what listing it here while Relearn stays in `theme` above achieves.
#
# To work against a local checkout of the module, set HUGO_MODULE_REPLACEMENTS in
# the environment rather than adding a `replacements` line here, so a dev-only
# path can never end up committed. The module's README has the full command.
[module]
  [[module.imports]]
    path = 'github.com/synergyvr-org/synergy-hugo-shared'

[params]
  themeVariant = 'zen-dark'
  disableInlineCopyToClipBoard = true

  # Keep sub-tables last: in TOML every key after a [params.x] header belongs to
  # that sub-table, so scalars above would be swallowed.
  [params.synergy]
    logo = 'nordic-logo.webp'
    logo2x = 'nordic-logo@2x.webp'
    logoAlt = 'Nordic Adventures, a mod list for Skyrim VR'
    footerCredit = 'Nordic Adventures by [Synergy Team](https://synergyvr.org/)'
    footerCredit2 = 'Docs by Davey'
    # This list's own screenshots, randomized behind each page's title banner.
    # Cropped 2.4:1 from Quest captures; the banner scales its height with the
    # viewport, so a taller crop shows the whole frame on narrow screens.
    # Every cover ships an @2x sibling, so the banner can use image-set().
    coverRetina = '@2x'
    coverImages = [
      'ss-aurora-ruins.webp',
      'ss-aurora-sky.webp',
      'ss-snowy-peaks.webp',
      'ss-misty-longhouse.webp',
    ]

    # Load-order separator colors. This list's MO2 sections aren't color-coded,
    # so rather than mirroring MO2 the ramp follows the site's own theme: the
    # aurora at the top of the list burning down through ember into the night sky
    # by the end of it. One band, so it runs as a single continuous gradient over
    # all 82 sections.
    [params.synergy.modlist]
      # The list's own title banner. Deliberately version-specific: the plain
      # 'Nordic Adventures ' would also match the "Nordic Adventures - Custom
      # Patches" section and turn it into a banner too. Bump the digit on a new
      # major version; if it ever stops matching, the banner just renders as an
      # ordinary section rather than breaking.
      #
      # This has to stay ABOVE the bands: everything after an array-of-tables
      # header belongs to that table, so down there it became bands[0].titlePrefix
      # and silently did nothing.
      titlePrefix = 'Nordic Adventures 2'
      [[params.synergy.modlist.bands]]
        stops = ['#ffad67', '#a83c1c', '#20203e']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = false
      # The content uses raw HTML (the module's shortcodes emit it, and some
      # pages hand-write markup Markdown can't express).
      unsafe = true
      xhtml = false
